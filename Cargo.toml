[package]
name = "emoji-picker"
version = "0.1.0"
edition = "2024"

# A picker that is launched, used and closed in a couple of seconds spends a real share of
# its life in the dynamic loader, so the binary is built for size and startup rather than
# for throughput.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Two UI backends. `native` is the default: smithay-client-toolkit drawing through cairo,
# with no toolkit above it. `gtk` is the original GTK 4 implementation, kept buildable as a
# reference and a fallback. Everything outside src/ui.rs, src/settings.rs, src/render.rs,
# src/grid.rs, src/picker.rs and the two backend modules is shared by both.
[features]
default = ["native"]
gtk = ["dep:gtk4", "dep:gtk4-layer-shell"]
native = [
    "dep:smithay-client-toolkit",
    "dep:cairo-rs",
    "dep:pango",
    "dep:pangocairo",
    "dep:xkbcommon",
    "dep:calloop",
]

[dependencies]
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }
async-channel = "2.5.0"
dirs = "7.0.0"
libc = "0.2.189"
# v4_8 is what exposes GtkSearchEntry's search-delay; the target desktop ships 4.22.
gtk4 = { version = "0.11.4", features = ["v4_8"], optional = true }
gtk4-layer-shell = { version = "0.8.1", optional = true }
# SCTK 0.21 resolves wayland-client 0.31 and wayland-backend 0.3, matching the pins below, so
# the input-method code and the UI share one Wayland stack rather than linking two.
smithay-client-toolkit = { version = "0.21.1", optional = true }
cairo-rs = { version = "0.22.9", optional = true }
pango = { version = "0.22.9", optional = true }
pangocairo = { version = "0.22.9", optional = true }
xkbcommon = { version = "0.9.0", optional = true }
calloop = { version = "0.14.4", optional = true }
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time"] }
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
wl-clipboard-rs = "0.9.3"
