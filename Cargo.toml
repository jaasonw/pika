[package]
name = "emoji-picker"
version = "0.1.0"
edition = "2024"

# A picker that is launched, used and closed in a couple of seconds spends a real share of
# its life in the dynamic loader, so the binary is built for size and startup rather than
# for throughput.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }
dirs = "7.0.0"
libc = "0.2.189"
# SCTK 0.21 resolves wayland-client 0.31 and wayland-backend 0.3, matching the pins below, so
# the input-method code and the UI share one Wayland stack rather than linking two.
smithay-client-toolkit = "0.21.1"
cairo-rs = "0.22.9"
pango = "0.22.9"
pangocairo = "0.22.9"
xkbcommon = "0.9.0"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time"] }
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
wl-clipboard-rs = "0.9.3"
