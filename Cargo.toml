[package]
name = "emoji-picker"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }
async-channel = "2.5.0"
dirs = "7.0.0"
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.1"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time"] }
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
wl-clipboard-rs = "0.9.3"
